[project]
name = "underscore"
version = "0.1.0"
description = "Analyze a podcast voice track and score it with background music"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.92.0",
    "mlx-whisper>=0.4.0",
    "numpy>=1.26",
    "soundfile>=0.12",
    "pydantic>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["underscore"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
