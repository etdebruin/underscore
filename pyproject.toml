[project]
name = "underscore"
version = "0.1.0"
description = "Analyze a podcast voice track and score it with background music"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.92.0",
    "mlx-whisper>=0.4.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "numpy>=1.26",
    "soundfile>=0.12",
    "pydantic>=2.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    "python-multipart>=0.0.32",
]

[project.scripts]
underscore-web = "underscore.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["underscore"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
